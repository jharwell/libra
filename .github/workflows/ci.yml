name: Build and test

# Run:
#
# - Every month. Scheduling helps keep drift/issues with updates
#   to runners at bay.
# - On pushes to relevant paths.
#
on:
  push:
    paths:
      - "cmake/**"
      - "cli/**"
      - ".github/**"
      - "docs/**"

  schedule:
    - cron: '0 0 1 * *'


concurrency:
  group: "build-and-test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  cmake-funcs-smoke-tests:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        shell: bash
        run: |
          cd tests && mkdir -p build && cd build
          cmake ..
          ctest --output-on-failure -j $(nproc)


  cmake-add-subdirectory-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_add_subdirectory.sh
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  cmake-installed-pkg-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_installed_package.sh
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  cmake-cpm-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_cpm.sh
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  cmake-conan-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_conan.sh
      pip-install-conan: true
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  schema-help-targets:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run LIBRA install
        shell: bash
        run: |
          cd tests/sample_basic
          cmake .
          uv run check-jsonschema --schemafile ../../schema/help-targets.yaml libra_targets.json


  cmake-self-install-test:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    steps:
      - uses: actions/checkout@v4
      - name: Run LIBRA install
        shell: bash
        run: |
          mkdir -p build && cd build
          cmake ..
          make install

  cli-build:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build
        working-directory: .

  cli-unit-tests:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    needs:
      - cli-build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test
        working-directory: .

  cli-smoke-tests:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    needs:
      - cli-build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CLI BATS smoke tests
        shell: bash
        run: |
          cargo build
          bats tests/cli_*.bats -j $(nproc)
        working-directory: ${{ github.workspace }}
        env:
          CLIBRA_BIN: ${{ github.workspace }}/target/debug/clibra

  docs:
    if: github.ref_name == 'master'
    uses: ./.github/workflows/pages.yml
    needs:
      - cmake-funcs-smoke-tests
      - cmake-add-subdirectory-smoke-tests
      - cmake-cpm-smoke-tests
      - cmake-conan-smoke-tests
      - cmake-installed-pkg-smoke-tests
      - cmake-self-install-test
      - cli-smoke-tests
      - cli-unit-tests
      - schema-help-targets
    secrets: inherit

  create-conan-pkg:
    # Only publish packages from master
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    needs:
      - cmake-funcs-smoke-tests
      - cmake-add-subdirectory-smoke-tests
      - cmake-cpm-smoke-tests
      - cmake-conan-smoke-tests
      - cmake-installed-pkg-smoke-tests
      - cmake-self-install-test
      - cli-smoke-tests
      - cli-unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Create package
        shell: bash
        run: |
          pip3 install conan
          conan profile detect
          conan create \
            --user jharwell \
            --lockfile-out=package.lock \
            .

  tag-dev-release:
    if: github.ref_type == 'branch' && github.ref_name == 'devel'
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:2026-03-16
    permissions:
      contents: write
    needs:
      - cmake-funcs-smoke-tests
      - cmake-add-subdirectory-smoke-tests
      - cmake-cpm-smoke-tests
      - cmake-conan-smoke-tests
      - cmake-installed-pkg-smoke-tests
      - cmake-self-install-test
      - cli-smoke-tests
      - cli-unit-tests
      - schema-help-targets
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required to inspect all existing tags.
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next dev tag
        id: tag
        shell: bash
        run: |
          git fetch --tags
          NEW_VERSION=$(./scripts/bump-version.sh)
          echo "New dev version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Bake version into self.cmake
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.new_version }}"
          # Strip leading 'v' for the CMake set() call
          VERSION="${VERSION#v}"

          cat > cmake/libra/self.cmake << EOF
          # GENERATED FILE -- do not edit.
          # Updated automatically by CI in the tag-dev-release job.
          # Any manual changes will be overwritten on the next devel merge.
          set(LIBRA_VERSION "${VERSION}")
          EOF

      - name: Commit and tag
        shell: bash
        run: |
          NEW_VERSION="${{ steps.tag.outputs.new_version }}"

          git add cmake/libra/self.cmake
          git commit -m "chore: update LIBRA_VERSION to ${NEW_VERSION}"

          # Tag the new commit, not the pre-commit HEAD
          git tag "${NEW_VERSION}"

          # Push the version bump commit to devel and the tag together
          git push origin HEAD:devel "${NEW_VERSION}"
