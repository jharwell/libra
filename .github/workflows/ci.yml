name: Build and test

# Run:
#
# - Every month. Scheduling helps keep drift/issues with updates
#   to runners at bay.
# - On pushes to relevant paths.
#
# Ignore tags. On both devel and master they are redundant, because CI would
# have previously succeeded for both on a branch commit (automatically for devel
# tags).
#
on:
  push:
  # Adding a branches filter automatically ignores all tag pushes, which we want
  # so pushing a release tag doesn't redundantly trigger this pipeline.
    branches:
      - '**'
    paths:
      - "cmake/**"
      - "cli/**"
      - ".github/**"
      - "docs/**"
      - "dots/**"
      - "tests/**"
      - "schema/**"
      - "CMakeLists.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "conanfile.py"

  schedule:
    - cron: '0 0 1 * *'


concurrency:
  group: "build-and-test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  cmake-funcs-smoke-tests:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        shell: bash
        run: |
          cd tests && mkdir -p build && cd build
          cmake ..
          ctest --output-on-failure -j $(nproc)


  cmake-add-subdirectory-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_add_subdirectory.sh
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  cmake-installed-pkg-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_installed_package.sh
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  cmake-cpm-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_cpm.sh
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  cmake-conan-smoke-tests:
    uses: ./.github/workflows/smoke-tests-compiler-matrix.yml
    with:
      suite-script: ./suites/run_suite_conan.sh
      pip-install-conan: true
      full-matrix: ${{ github.ref_name == 'devel' || github.ref_name == 'master' || github.event_name == 'schedule' }}

  schema-help-targets:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    steps:
      - uses: actions/checkout@v4
      - name: Run LIBRA install
        shell: bash
        run: |
          cd tests/sample_basic
          cmake .
          uv run check-jsonschema --schemafile ../../schema/help-targets.yaml libra_targets.json


  cmake-self-install-test:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    steps:
      - uses: actions/checkout@v4
      - name: Run LIBRA install
        shell: bash
        run: |
          mkdir -p build && cd build
          cmake ..
          make install

  cli-build:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI
        run: cargo build
        working-directory: .

  cli-unit-tests:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    needs:
      - cli-build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test
        working-directory: .

  cli-smoke-tests:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    needs:
      - cli-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CLI BATS smoke tests
        shell: bash
        run: |
          cargo build
          bats tests/cli_*.bats -j $(nproc)
        working-directory: ${{ github.workspace }}
        env:
          CLIBRA_BIN: ${{ github.workspace }}/target/debug/clibra

  tag-dev-release:
    if: github.ref_type == 'branch' && github.ref_name == 'devel'
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    permissions:
      contents: write
    needs:
      - cmake-funcs-smoke-tests
      - cmake-add-subdirectory-smoke-tests
      - cmake-cpm-smoke-tests
      - cmake-conan-smoke-tests
      - cmake-installed-pkg-smoke-tests
      - cmake-self-install-test
      - cli-smoke-tests
      - cli-unit-tests
      - schema-help-targets
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required to inspect all existing tags.
          fetch-depth: 0
          # Push with GITHUB_TOKEN (the default), NOT a PAT. Tag pushes made
          # with GITHUB_TOKEN cannot trigger further workflow runs (GitHub's
          # built-in loop protection), and this workflow ignores tag pushes
          # anyway. Dev tagging has no downstream workflow to fire, so it does
          # not need the release PAT.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build clibra
        shell: bash
        run: |
          cargo build

      - name: Compute next dev tag
        id: tag
        shell: bash
        run: |
          git fetch --tags
          git tag -l
          target/debug/clibra version --self --log debug
          NEW_VERSION=v$(target/debug/clibra version --self --bump)
          echo "New dev version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Tag tested commit
        shell: bash
        run: |
          NEW_VERSION="${{ steps.tag.outputs.new_version }}"

          # Tag the exact commit every job above built and tested. No version
          # commit: LIBRA_VERSION comes from the tag in git checkouts, from
          # export-subst expansion of cmake/libra/self.cmake in `git archive`
          # tarballs, and from conanfile.py's package() bake in Conan packages.
          #
          # The tag lands on devel's own history, so `git describe` finds it.
          # If devel is later force-pushed the tag may become unreachable;
          # `clibra version --bump` allocates from the global tag set, so
          # bumping stays correct regardless.
          git tag -a "${NEW_VERSION}" -m "dev release ${NEW_VERSION}" "${GITHUB_SHA}"

          # Tag only; nothing is pushed to devel. Rejected (and the job fails)
          # if the tag already exists on the remote -- never retry with -f.
          git push origin "refs/tags/${NEW_VERSION}"
