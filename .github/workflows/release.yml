name: Release

# Triggered manually via workflow_dispatch with the stable version to release
# (e.g. 1.5.0). Tags the current HEAD of master as v<version> and creates the
# GitHub release, which triggers publish.yml.
#
# Keeping this in a dedicated workflow rather than in ci.yml avoids the
# GitHub Actions footgun where mixing `tags:` and `paths:` under the same
# `push:` trigger changes evaluation semantics and can suppress branch push
# runs unexpectedly.
#
# The human is responsible for verifying that CI passed on master before
# dispatching. No test jobs here -- the tag goes on that exact tested commit.
#
# Uses BOT_RELEASE_TOKEN rather than GITHUB_TOKEN so that creating the
# GitHub release triggers the publish workflow. A workflow cannot trigger
# another workflow with the same token it was invoked with.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release, without leading v (e.g. 1.5.0)"
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-libra:20260918
    permissions:
      contents: write
    steps:
      - name: Validate version input
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          # Reject a leading v and any prerelease suffix -- stable only.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '${VERSION}' must be a bare stable semver like 1.5.0 (no leading v, no -dev/-rc suffix)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Release from master; full history so tag creation and describe work.
          ref: master
          fetch-depth: 0
          # Use the bot token so the tag push can trigger downstream workflows.
          token: ${{ secrets.BOT_RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Guard against pre-existing tag
        shell: bash
        run: |
          git fetch --tags
          TAG="v${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists -- refusing to overwrite. Bump the version."
            exit 1
          fi

      - name: Tag master
        shell: bash
        run: |
          TAG="v${{ inputs.version }}"

          # Tag master's HEAD directly -- the commit CI tested. No version
          # commit: LIBRA_VERSION comes from the tag in git checkouts, from
          # export-subst expansion of cmake/libra/self.cmake in `git archive`
          # tarballs, and from conanfile.py's package() bake in Conan packages.
          #
          # Because nothing is committed, there is no [skip ci] and no
          # interaction with tag-push event suppression. The tag push (made
          # with the PAT) does not re-run ci.yml, whose branches filter
          # ignores tags. publish.yml fires from the release event created
          # below, not from this push.
          git tag -a "${TAG}" -m "release ${TAG}"

          # First-time creation only -- never -f.
          git push origin "refs/tags/${TAG}"

      - name: Install GitHub CLI
        uses: step-security/setup-gh@v1

      - name: Github release
        env:
          GH_TOKEN: ${{ secrets.BOT_RELEASE_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "Release v${{ inputs.version }}" \
            --verify-tag \
            --latest

  docs:
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    needs: [create-release]

  create-conan-pkg:
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
        with:
          # Without an explicit ref, a workflow_dispatch run checks out
          # whatever branch the dispatch was started from, not the release.
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - name: Build CLI
        run: cargo build
        working-directory: .
      - name: Create package
        shell: bash
        run: |
          git tag -l
          pip3 install conan
          conan profile detect
          conan create \
            --user jharwell \
            --lockfile-out=package.lock \
            .
